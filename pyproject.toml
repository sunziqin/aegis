[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "millennium-jev"
version = "2.1.0"
description = "Millennium-Jev: Provably Safe Non-Autoregressive System 1 Decision Reflex Foundation for AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Millennium Open Source Team" }
]
keywords = [
    "millennium",
    "jev",
    "system-1",
    "decision-reflex",
    "conformal-prediction",
    "non-autoregressive",
    "ai-agent",
    "routing"
]
dependencies = [
    "torch>=2.0.0",
    "transformers==4.50.0",
    "peft>=0.7.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]
ops = [
    "paramiko>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["millennium_jev*", "open_s1*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
